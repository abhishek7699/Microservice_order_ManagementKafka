# kind cluster for local development on Apple Silicon.
# Host port 8080 forwards to NodePort 30080, where api-gateway is exposed.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: order-local
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
